<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DataViz Pro - Data Analytics Tool{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.plot.ly/plotly-2.25.2.min.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="{{ url_for('index') }}" class="nav-brand">
                <div class="logo-icon">📊</div>
                <span>DataViz</span> Pro
            </a>
            <div class="nav-actions">
                {% if filename %}
                <a href="{{ url_for('delete_file', filename=filename) }}" 
                   class="btn btn-danger" 
                   onclick="return confirm('Are you sure you want to delete this file?')">
                    🗑️ Delete
                </a>
                {% endif %}
                <a href="{{ url_for('index') }}" class="btn btn-outline">
                    📁 New Upload
                </a>
            </div>
        </div>
    </nav>

    <div id="alertContainer"></div>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer style="text-align:center;padding:32px 0;color:var(--gray-500);font-size:14px;border-top:1px solid var(--gray-200);margin-top:40px;">
        <p>© 2024 DataViz Pro - Built with ❤️ using Flask & Plotly</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
