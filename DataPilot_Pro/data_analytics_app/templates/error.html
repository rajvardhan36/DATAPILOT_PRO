{% extends "base.html" %}

{% block content %}
<div style="text-align:center;padding:80px 0;">
    <div style="font-size:80px;margin-bottom:24px;">
        {% if error_code == 404 %}
            🔍
        {% else %}
            ⚠️
        {% endif %}
    </div>
    <h1 style="font-size:48px;font-weight:700;margin-bottom:8px;">{{ error_code }}</h1>
    <p style="font-size:20px;color:var(--gray-600);margin-bottom:32px;">{{ error_message }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary" style="padding:12px 32px;">
        🏠 Go Home
    </a>
</div>
{% endblock %}
